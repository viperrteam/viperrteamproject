<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}VipeRR Hub — Образовательные траектории{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ══════════════ ПЕРЕМЕННЫЕ ══════════════ */
    :root {
      --bg:            #070b12;
      --bg2:           #0c1220;
      --bg3:           #101928;
      --bg4:           #141f30;
      --border:        #1a2840;
      --border2:       #213252;
      --border3:       #2a3f64;
      --accent:        #2563eb;
      --accent2:       #3b82f6;
      --accent3:       #60a5fa;
      --accent-glow:   rgba(37,99,235,0.22);
      --accent-glow2:  rgba(59,130,246,0.35);
      --purple:        #7c3aed;
      --purple2:       #a855f7;
      --purple-glow:   rgba(124,58,237,0.2);
      --text:          #e2eaf5;
      --text2:         #8fa3c0;
      --text3:         #4a6380;
      --success:       #10b981;
      --success-bg:    rgba(16,185,129,0.08);
      --error:         #ef4444;
      --error-bg:      rgba(239,68,68,0.08);
      --warn:          #f59e0b;
      --radius:        14px;
      --radius-sm:     9px;
      --radius-xs:     6px;
      --shadow:        0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg:     0 8px 40px rgba(0,0,0,0.5);
      --transition:    all .2s cubic-bezier(.4,0,.2,1);
    }

    /* ══════════════ RESET ══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Скроллбар */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border3); }

    body {
      font-family: 'Onest', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ══════════════ LAYOUT ══════════════ */
    .layout { display: flex; min-height: 100vh; }

    /* ══════════════ САЙДБАР ══════════════ */
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 26px 20px 22px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(37,99,235,0.06) 0%, transparent 100%);
    }
    .logo-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 24px var(--accent-glow), 0 0 8px var(--purple-glow);
      flex-shrink: 0;
      transition: var(--transition);
    }
    .logo-mark:hover .logo-icon { transform: rotate(-8deg) scale(1.05); box-shadow: 0 0 32px var(--accent-glow2); }
    .logo-text { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; line-height: 1; }
    .logo-sub  { font-size: 10px; color: var(--text3); font-weight: 400; margin-top: 3px; letter-spacing: 0.5px; }

    .sidebar-nav { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 3px; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: var(--text2);
      font-size: 13.5px; font-weight: 500;
      transition: var(--transition);
      position: relative;
    }
    .nav-item::before {
      content: '';
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 3px; height: 0; border-radius: 99px;
      background: linear-gradient(180deg, var(--accent2), var(--purple2));
      transition: height .2s ease;
    }
    .nav-item:hover { background: var(--bg3); color: var(--text); }
    .nav-item:hover::before { height: 60%; }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(37,99,235,.12), rgba(124,58,237,.08));
      color: var(--accent2);
      border: 1px solid rgba(37,99,235,.18);
    }
    .nav-item.active::before { height: 70%; }
    .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 14px 12px 16px;
      border-top: 1px solid var(--border);
    }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg3);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .user-name  { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
    .user-email { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

    .logout-btn {
      width: 100%; padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text3);
      font-size: 12.5px; font-family: inherit; cursor: pointer;
      transition: var(--transition);
      text-align: center; text-decoration: none; display: flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    .logout-btn:hover { border-color: var(--error); color: var(--error); background: var(--error-bg); }

    /* ══════════════ MAIN AREA ══════════════ */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
    .topbar {
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg2);
      flex-shrink: 0;
    }
    .page-title { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
    .page-sub   { font-size: 12.5px; color: var(--text2); margin-top: 2px; }
    .topbar-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      color: var(--text3);
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: var(--radius-xs);
    }

    .content { flex: 1; padding: 26px 32px; overflow-y: auto; }

    /* ══════════════ FLASH MESSAGES ══════════════ */
    .flash-list { list-style: none; margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
    .flash-item {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px; font-weight: 500;
      border: 1px solid;
      display: flex; align-items: center; gap: 10px;
      animation: slideIn .3s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .flash-item::before { font-size: 15px; flex-shrink: 0; }
    .flash-item.success {
      background: var(--success-bg);
      border-color: rgba(16,185,129,.25);
      color: #6ee7b7;
    }
    .flash-item.success::before { content: '✓'; color: var(--success); }
    .flash-item.error {
      background: var(--error-bg);
      border-color: rgba(239,68,68,.25);
      color: #fca5a5;
    }
    .flash-item.error::before { content: '✕'; color: var(--error); }

    /* ══════════════ КНОПКИ ══════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 20px;
      border-radius: var(--radius-sm);
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      cursor: pointer; border: none; text-decoration: none;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn svg { flex-shrink: 0; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      color: #fff;
      box-shadow: 0 0 20px var(--accent-glow), 0 2px 8px rgba(0,0,0,.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      box-shadow: 0 0 32px var(--accent-glow2), 0 4px 16px rgba(0,0,0,.4);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(37,99,235,.06); }
    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid rgba(239,68,68,.3);
    }
    .btn-danger:hover { background: var(--error-bg); border-color: var(--error); }

    /* ══════════════ ПОЛЯ ВВОДА ══════════════ */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12.5px; font-weight: 600; color: var(--text2); letter-spacing: 0.2px; }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
      width: 16px; height: 16px;
    }
    .input-wrap .input { padding-left: 40px; }

    .input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit; font-size: 14px;
      transition: var(--transition);
      outline: none;
    }
    .input:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: var(--bg4);
    }
    .input:focus + .input-icon { color: var(--accent2); }
    .input::placeholder { color: var(--text3); }
    .input:hover:not(:focus) { border-color: var(--border3); }

    /* ══════════════ КАРТОЧКИ КУРСОВ ══════════════ */
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .course-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      cursor: default;
    }
    .course-card::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,.04), rgba(124,58,237,.04));
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    .course-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--purple2));
      opacity: 0;
      transition: opacity .25s;
    }
    .course-card:hover {
      border-color: var(--border3);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(37,99,235,.12);
    }
    .course-card:hover::before { opacity: 1; }
    .course-card:hover::after  { opacity: 1; }

    .course-title {
      font-size: 14.5px; font-weight: 600; color: var(--text);
      line-height: 1.4;
    }
    .course-desc {
      font-size: 12.5px; color: var(--text2); line-height: 1.6; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ══════════════ ТЕГИ ══════════════ */
    .tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-chip {
      padding: 3px 10px;
      background: rgba(37,99,235,.1);
      border: 1px solid rgba(37,99,235,.2);
      border-radius: 99px;
      font-size: 11px; font-weight: 500; color: var(--accent3);
      cursor: pointer; transition: var(--transition); text-decoration: none;
      white-space: nowrap;
    }
    .tag-chip:hover { background: rgba(37,99,235,.22); border-color: var(--accent); color: var(--accent2); }
    .tag-chip.active {
      background: linear-gradient(135deg, rgba(37,99,235,.2), rgba(124,58,237,.15));
      border-color: var(--accent);
      color: var(--accent2);
    }
    .tag-chip.match {
      background: rgba(168,85,247,.15);
      border-color: rgba(168,85,247,.35);
      color: var(--purple2);
    }
    .tag-chip.match:hover { background: rgba(168,85,247,.28); border-color: var(--purple2); }

    /* ══════════════ ПАГИНАЦИЯ ══════════════ */
    .pagination {
      display: flex; align-items: center; gap: 6px;
      justify-content: center; margin-top: 36px;
    }
    .page-link {
      min-width: 36px; height: 36px; padding: 0 10px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      text-decoration: none; font-size: 13.5px; font-weight: 500;
      color: var(--text2); border: 1px solid var(--border);
      transition: var(--transition);
      font-family: 'JetBrains Mono', monospace;
    }
    .page-link:hover   { border-color: var(--accent); color: var(--accent2); background: rgba(37,99,235,.07); }
    .page-link.current {
      background: linear-gradient(135deg, var(--accent), #1d4ed8);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .page-dots {
      color: var(--text3); font-size: 13px;
      display: flex; align-items: center; height: 36px; padding: 0 4px;
    }

    /* ══════════════ ПОИСК ══════════════ */
    .search-bar { display: flex; gap: 10px; margin-bottom: 22px; }
    .search-bar .input { flex: 1; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap .input { padding-left: 42px; }
    .search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text3); pointer-events: none;
      width: 17px; height: 17px;
    }

    /* ══════════════ ФИЛЬТР ══════════════ */
    .filter-section {
      margin-bottom: 22px;
      padding: 16px 18px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .filter-label {
      font-size: 11px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* ══════════════ ПРОФИЛЬ ══════════════ */
    .profile-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px 28px;
      margin-bottom: 20px;
    }
    .profile-header {
      display: flex; align-items: center; gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .profile-avatar {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 700; color: #fff;
      box-shadow: 0 0 32px var(--accent-glow), 0 0 16px var(--purple-glow);
      flex-shrink: 0;
    }
    .profile-info-name  { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
    .profile-info-email { font-size: 13.5px; color: var(--text2); margin-top: 4px; }

    .stat-row  { display: flex; gap: 32px; flex-wrap: wrap; }
    .stat-item { display: flex; flex-direction: column; gap: 3px; }
    .stat-value {
      font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--purple2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-label { font-size: 12px; color: var(--text3); }

    /* ══════════════ ИНТЕРЕСЫ ══════════════ */
    .interests-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .interest-label {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 14px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 99px;
      cursor: pointer; transition: var(--transition);
      font-size: 12.5px; font-weight: 500; color: var(--text2);
      user-select: none;
    }
    .interest-label:hover { border-color: var(--border3); color: var(--text); background: var(--bg4); }
    .interest-label input { display: none; }
    .check-icon {
      width: 13px; height: 13px; flex-shrink: 0;
      opacity: 0; transition: opacity .15s;
      color: var(--accent2);
    }
    .interest-label:has(input:checked) {
      background: linear-gradient(135deg, rgba(37,99,235,.14), rgba(124,58,237,.1));
      border-color: rgba(37,99,235,.35);
      color: var(--accent2);
    }
    .interest-label:has(input:checked) .check-icon { opacity: 1; }

    /* ══════════════ AUTH СТРАНИЦЫ ══════════════ */
    .auth-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(37,99,235,.12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(124,58,237,.1) 0%, transparent 50%);
      padding: 24px;
    }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 42px 40px;
      box-shadow: var(--shadow-lg), 0 0 80px rgba(37,99,235,.07);
      animation: fadeUp .4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .auth-logo { text-align: center; margin-bottom: 30px; }
    .auth-logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 40px var(--accent-glow), 0 0 20px var(--purple-glow);
      margin-bottom: 14px;
    }
    .auth-logo-brand {
      font-size: 10.5px; color: var(--text3);
      letter-spacing: 2px; text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .auth-title { font-size: 23px; font-weight: 700; text-align: center; margin-bottom: 6px; letter-spacing: -0.3px; }
    .auth-sub   { font-size: 13.5px; color: var(--text2); text-align: center; margin-bottom: 28px; }
    .auth-form  { display: flex; flex-direction: column; gap: 16px; }
    .auth-footer { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text2); }
    .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: 600; transition: color .15s; }
    .auth-footer a:hover { color: var(--accent3); text-decoration: underline; }

    /* ══════════════ СЕКЦИЯ DIVIDER ══════════════ */
    .section-divider {
      font-size: 11px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .section-divider::after {
      content: '';
      flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* ══════════════ ПУСТЫЕ СОСТОЯНИЯ ══════════════ */
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text3);
    }
    .empty-state-icon {
      width: 52px; height: 52px;
      margin: 0 auto 16px;
      opacity: .25;
    }
    .empty-state p { font-size: 14.5px; color: var(--text2); margin-top: 8px; }
    .empty-state-title { font-size: 17px; font-weight: 600; color: var(--text2); }

    /* ══════════════ FOR YOU ══════════════ */
    .for-you-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 80px 24px; gap: 12px;
      animation: fadeUp .4s ease;
    }
    .for-you-empty-icon {
      font-size: 52px; line-height: 1;
      background: linear-gradient(135deg, var(--accent2), var(--purple2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px; opacity: 0.6;
    }
    .for-you-empty-title { font-size: 20px; font-weight: 700; color: var(--text); }
    .for-you-empty-text  { font-size: 13.5px; color: var(--text2); max-width: 360px; line-height: 1.65; }

    .foryou-interests-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 24px;
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(37,99,235,.06), rgba(124,58,237,.05));
      border: 1px solid rgba(37,99,235,.18);
      border-radius: var(--radius);
